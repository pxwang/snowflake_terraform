name: "Snowflake Bootstrap Workflow"

on:
  # Manual trigger — bootstrap changes are rare and high-impact.
  workflow_dispatch:
  # Also trigger automatically when bootstrap files change on main.
  push:
    branches:
      - main
    paths:
      - "snowflake-bootstrap/**"

jobs:
  snowflake-bootstrap:
    name: "Snowflake Bootstrap Job"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake-bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
